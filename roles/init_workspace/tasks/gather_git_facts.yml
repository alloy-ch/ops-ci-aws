---

- name: 'check if the task is executed from within a git repo'
  shell: |-
    if git rev-parse --is-inside-work-tree > /dev/null 2>&1;
    then
      echo "true"
    else
      echo "false"
    fi
  register: r_git_repo_check
  no_log: '{{ ansible_verbosity < 3 }}'

- set_fact:
    is_within_git_repo: '{{ r_git_repo_check.stdout }}'

- name: 'gather git repository info'
  block:
    - name: 'get git repo name'
      shell: basename -s .git $(git config --get remote.origin.url)
      register: r_git_repo_name
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'get HEAD commit hash (full)'
      command: git rev-parse HEAD
      register: r_git_commit_hash
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'get HEAD commit hash (short)'
      command: git rev-parse --short HEAD
      register: r_git_commit_hash_short
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'check pending changes'
      shell: "[[ -z $(git status -s --untracked-files=no) ]] || echo 'dirty'"
      register: r_git_short_status
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'get current git branch name'
      command: git rev-parse --abbrev-ref HEAD
      register: r_git_branch
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'get the tags pointing at HEAD'
      command: git tag --points-at HEAD
      register: r_git_tags_at_head
      no_log: '{{ ansible_verbosity < 3 }}'

    - name: 'check if we are in CodeBuild environment'
      set_fact:
        codebuild_build_number: "{{ lookup('ansible.builtin.env', 'CODEBUILD_BUILD_NUMBER', default='') }}"

    # A webhook build checks out the commit it was triggered for, a detached HEAD, so `git rev-parse --abbrev-ref HEAD`
    # says `HEAD` for every push to a branch. The branch built is in the webhook's head ref (`refs/heads/develop`); a
    # build started at a branch name checks out the branch, but should the checkout be detached, its source version
    # (`develop`) names it. A commit, a tag or a pull request (`pr/12`) names no branch: the build stays `HEAD`.
    - name: 'work out the branch CodeBuild built'
      set_fact:
        _source_ref: >-
          {{ lookup('ansible.builtin.env', 'CODEBUILD_WEBHOOK_HEAD_REF', default='')
             or lookup('ansible.builtin.env', 'CODEBUILD_SOURCE_VERSION', default='') }}

    - set_fact:
        _source_branch: >-
          {{ _source_ref | regex_replace('^refs/heads/', '')
             if codebuild_build_number != '' and r_git_branch.stdout == 'HEAD'
                and _source_ref != ''
                and not (_source_ref is match('^(refs/tags/|refs/pull/|pr/)'))
                and not (_source_ref is match('^[0-9a-fA-F]{7,40}$'))
                and (_source_ref | regex_replace('^refs/heads/', '')) not in r_git_tags_at_head.stdout_lines
             else r_git_branch.stdout }}

    - set_fact:
        git_info:
          repo_name: '{{ r_git_repo_name.stdout }}'
          branch_name: '{{ r_git_branch.stdout }}'
          source_branch: '{{ _source_branch | trim }}'
          commit_hash: '{{ r_git_commit_hash.stdout }}'
          commit_hash_short: '{{ r_git_commit_hash_short.stdout }}'
          tags_at_head: '{{ r_git_tags_at_head.stdout_lines }}'
          has_pending_changes: "{{ false if codebuild_build_number != '' else r_git_short_status.stdout == 'dirty' }}"
  when: is_within_git_repo

- name: 'create an empty git repository info dict'
  set_fact:
    git_info: {}
  when: not is_within_git_repo
