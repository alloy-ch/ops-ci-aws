---
# The `Version` tag of the stack:
#   - `version_tag_override` when given (overrules `skip_version_tag`);
#   - nothing when `skip_version_tag`;
#   - `v<project_version>` for a build of a release line (`release_branches`) or of the version tag itself;
#   - `v<project_version>+<branch>.<short commit>` for a build of any other ref (a feature branch, a detached
#     commit), so that the tag says it is not the released artefact. Semver build metadata, e.g. `v1.4.0+fix-x.3f2a1c9`;
#   - the same with `.dirty` appended when the working tree had uncommitted changes (a laptop deploy), whatever the
#     ref: `v1.4.0+main.3f2a1c9.dirty`.

- name: '[{{ stack_name }}] work out which branch was built'
  set_fact:
    # `source_branch`: the branch built, also for a CodeBuild webhook build, whose checkout is detached
    _branch: "{{ git_info.source_branch | default(git_info.branch_name | default('')) }}"

- name: '[{{ stack_name }}] work out which code line is deployed'
  set_fact:
    _dirty: "{{ git_info.has_pending_changes | default(false) | bool }}"
    _release_line: >-
      {{ _branch == ''
         or _branch in release_branches
         or ('v' ~ project_version) in (git_info.tags_at_head | default([])) }}
    # the branch label is capped: tag values may have 256 characters, git branch names may be longer than that
    _branch_label: >-
      {{ (('detached' if _branch == 'HEAD' else _branch) | regex_replace('[^A-Za-z0-9.-]', '-'))[:64] }}

- name: '[{{ stack_name }}] work out the Version tag'
  set_fact:
    version_tag: >-
      {{ version_tag_override if (version_tag_override | default('')) != ''
         else ('' if skip_version_tag
         else ('v' ~ project_version if (_release_line | bool) and not (_dirty | bool)
         else 'v' ~ project_version ~ '+' ~ _branch_label ~ '.' ~ (git_info.commit_hash_short | default(''))
              ~ ('.dirty' if (_dirty | bool) else '')))
      }}
